name: Build Minef plugin

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout plugin repo
        uses: actions/checkout@v4

      # Gradle-обвязка ветки feature/26.2 (Gradle 8.5) не умеет запускаться
      # на JDK 25 - в её собственных релиз-нотах заявлена поддержка только
      # до Java 21. Поэтому сначала ставим JDK 21 именно для этого шага,
      # и только потом переключаемся на JDK 25 для сборки самого плагина.
      - name: Set up JDK 21 (для сборки MCProtocolLib через Gradle)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # MCProtocolLib под Minecraft/Paper 26.2 ещё не опубликован как
      # релиз/снапшот в Maven - собираем его из ветки feature/26.2
      # и публикуем в локальный ~/.m2, откуда его подхватит Maven-сборка
      # плагина ниже.
      - name: Checkout MCProtocolLib (feature/26.2)
        uses: actions/checkout@v4
        with:
          repository: GeyserMC/MCProtocolLib
          ref: feature/26.2
          path: mcprotocollib-src

      - name: Grant execute permission for gradlew
        working-directory: mcprotocollib-src
        run: chmod +x gradlew

      - name: Build & publish MCProtocolLib to local Maven repo
        working-directory: mcprotocollib-src
        run: ./gradlew publishToMavenLocal --no-daemon

      # На случай, если версия из feature/26.2 отличается от значения
      # в pom.xml - выводим, что реально опубликовалось, чтобы было
      # видно в логах и можно было поправить pom.xml при расхождении.
      - name: Show published MCProtocolLib version
        run: find ~/.m2/repository/org/geysermc/mcprotocollib -maxdepth 2 -type d

      # Теперь переключаемся на JDK 25 - именно она нужна для сборки
      # самого плагина под Paper 26.2 (setup-java перезапишет JAVA_HOME
      # на следующих шагах).
      - name: Set up JDK 25 (для сборки плагина под Paper 26.2)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build Minef plugin
        run: mvn -B clean package

      - name: Upload built jar
        uses: actions/upload-artifact@v4
        with:
          name: minef-plugin
          path: target/minef.jar
